<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="115" ry="115" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="22" y="22" width="468" height="468" rx="110" ry="110" fill="none" stroke="#34D399" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Tilted Playing Card Motif in Center -->
  <g transform="rotate(-5 256 256)">
    <!-- White Card Body -->
    <rect x="120" y="86" width="272" height="340" rx="26" ry="26" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="126" y="92" width="260" height="328" rx="22" ry="22" fill="none" stroke="#CBD5E1" stroke-width="2.5"/>

    <!-- Corner A + Spade -->
    <text x="144" y="142" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" fill="#0F172A">A</text>
    <path d="M 154,152 C 154,152 142,165 142,173 C 142,179 146,183 151,181 C 152,181 153,180 154,178 C 153,182 150,185 147,186 L 161,186 C 158,185 155,182 154,178 C 155,180 156,181 157,181 C 162,183 166,179 166,173 C 166,165 154,152 154,152 Z" fill="#0F172A"/>

    <!-- Large Center Spade ♠ -->
    <path d="M 256,145 C 256,145 168,235 168,290 C 168,332 204,354 240,340 C 248,337 252,329 253,322 C 248,348 230,372 210,380 L 302,380 C 282,372 264,348 259,322 C 260,329 264,337 272,340 C 308,354 344,332 344,290 C 344,235 256,145 256,145 Z" fill="#0F172A"/>
  </g>

  <!-- Gold Checkmark Badge in Bottom Corner -->
  <circle cx="395" cy="395" r="44" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="395" cy="395" r="41" fill="none" stroke="#FEF3C7" stroke-width="2"/>
  <path d="M 380,395 L 391,406 L 413,383" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>